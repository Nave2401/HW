<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f2e9">
    <title>Pass It On | Book Donation</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #192c28;
            --muted: #64716a;
            --paper: #f4f2e9;
            --white: #fffefa;
            --green: #236b50;
            --green-dark: #174a39;
            --lime: #d7ef83;
            --line: #d9ded5;
            --serif: Georgia, "Times New Roman", serif;
            --sans: "Trebuchet MS", "Segoe UI", sans-serif;
        }
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            line-height: 1.5;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1240px;
            margin: auto;
            padding: 22px 34px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            aspect-ratio: 1;
            place-items: center;
            border-radius: 50%;
            background: var(--green);
            color: white;
            font-family: var(--serif);
            font-size: 22px;
        }

        .topbar-note {
            color: var(--muted);
            font-size: 13px;
        }

        main {
            display: grid;
            grid-template-columns: minmax(300px, .9fr) minmax(480px, 1.1fr);
            max-width: 1240px;
            min-height: calc(100vh - 80px);
            margin: 0 auto 36px;
            padding: 0 34px;
        }

        .story {
            position: relative;
            display: flex;
            min-height: 680px;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: clamp(30px, 5vw, 64px);
            border-radius: 5px 0 0 5px;
            background: #244b3d;
            color: white;
            isolation: isolate;
        }

        .story::before {
            position: absolute;
            z-index: -2;
            inset: 0;
            background: linear-gradient(180deg, rgba(16, 39, 31, .18) 12%, rgba(16, 39, 31, .88) 100%),
                url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1400&q=85") center / cover;
            content: "";
        }

        .story::after {
            position: absolute;
            z-index: -1;
            inset: 0;
            background: linear-gradient(135deg, rgba(21, 63, 47, .18), transparent 60%);
            content: "";
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0;
            color: var(--lime);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--lime);
            content: "";
        }

        .story-copy {
            max-width: 400px;
        }

        .story h1 {
            margin: 0 0 18px;
            font-family: var(--serif);
            font-size: clamp(46px, 5.3vw, 72px);
            font-weight: 400;
            line-height: .98;
            letter-spacing: 0;
        }

        .story-copy>p:last-child {
            max-width: 340px;
            margin: 0;
            color: rgba(255, 255, 255, .83);
            font-size: 15px;
        }

        .story-foot {
            display: flex;
            align-items: center;
            gap: 14px;
            color: rgba(255, 255, 255, .86);
            font-size: 12px;
        }

        .book-stack {
            display: flex;
            align-items: center;
            height: 31px;
            padding-left: 2px;
        }

        .book-stack span {
            width: 23px;
            height: 23px;
            margin-left: -3px;
            border: 2px solid #244b3d;
            border-radius: 50%;
            background: var(--lime);
        }

        .book-stack span:nth-child(2) {
            background: #f2a46f;
        }

        .book-stack span:nth-child(3) {
            background: #f4f2e9;
        }

        .form-panel {
            padding: clamp(30px, 5vw, 62px) clamp(28px, 5vw, 64px);
            border: 1px solid #e5e6dc;
            border-left: 0;
            border-radius: 0 5px 5px 0;
            background: var(--white);
        }

        .form-heading {
            margin-bottom: 27px;
        }

        .form-heading .eyebrow {
            color: var(--green);
        }

        .form-heading .eyebrow::before {
            background: var(--green);
        }

        .form-heading h2 {
            margin: 10px 0 6px;
            font-family: var(--serif);
            font-size: 34px;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0;
        }

        .form-heading>p:last-child {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        form {
            display: grid;
            gap: 20px;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 13px;
            color: var(--green-dark);
            font-size: 12px;
            font-weight: 800;
        }

        .section-label span {
            display: grid;
            width: 23px;
            aspect-ratio: 1;
            place-items: center;
            border-radius: 50%;
            background: #eaf1e4;
            color: var(--green);
            font-size: 11px;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 13px 14px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label,
        legend {
            color: #35443d;
            font-size: 11px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 43px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 3px;
            outline: none;
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-size: 13px;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        textarea {
            min-height: 66px;
            resize: vertical;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(35, 107, 80, .12);
        }
        input::placeholder,
        textarea::placeholder {
            color: #9ba49e;
        }
        fieldset {
            min-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
        }
        fieldset legend {
            margin-bottom: 9px;
        }
        .choice-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .choice {
            display: flex;
            min-height: 47px;
            align-items: center;
            gap: 9px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 3px;
            color: #35443d;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .choice:has(input:checked) {
            border-color: var(--green);
            background: #f1f6ed;
        }
        .choice input,
        .checkline input {
            width: 16px;
            min-height: 16px;
            height: 16px;
            margin: 0;
            accent-color: var(--green);
        }
        .checkline {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 400;
        }
        .checkline input {
            flex: 0 0 auto;
            margin-top: 2px;
        }
        .submit-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding-top: 2px;
        }
        .submit-row small {
            max-width: 190px;
            color: var(--muted);
            font-size: 10px;
        }
        button {
            display: inline-flex;
            min-height: 46px;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 0 19px;
            border: 0;
            border-radius: 3px;
            background: var(--green);
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 800;
            transition: background .18s ease, transform .18s ease;
        }
        button:hover {
            transform: translateY(-1px);
            background: var(--green-dark);
        }
        button:focus-visible {
            outline: 3px solid #a6c778;
            outline-offset: 3px;
        }
        button span {
            font-size: 18px;
            line-height: 1;
        }
        .success {
            display: none;
            margin-top: 17px;
            padding: 13px 15px;
            border-left: 3px solid var(--green);
            background: #edf5e9;
            color: var(--green-dark);
            font-size: 12px;
        }
        .success.visible {
            display: block;
        }
        @media (max-width: 820px) {
            main {
                grid-template-columns: minmax(240px, .75fr) minmax(400px, 1.25fr);
                padding: 0 20px;
            }
            .story {
                min-height: 720px;
                padding: 32px;
            }
            .form-panel {
                padding: 36px 30px;
            }
            .story h1 {
                font-size: 54px;
            }
        }
        @media (max-width: 680px) {
            .topbar {
                padding: 16px 20px;
            }
            .topbar-note {
                font-size: 11px;
            }
            main {
                display: flex;
                flex-direction: column;
                min-height: 0;
                margin-bottom: 20px;
                padding: 0 14px;
            }
            .story {
                min-height: 360px;
                padding: 25px;
                border-radius: 4px 4px 0 0;
            }
            .story h1 {
                max-width: 360px;
                font-size: 50px;
            }
            .story-copy>p:last-child {
                font-size: 13px;
            }
            .form-panel {
                padding: 29px 22px;
                border: 1px solid #e5e6dc;
                border-top: 0;
                border-radius: 0 0 4px 4px;
            }
            .form-heading h2 {
                font-size: 30px;
            }
        }
        @media (max-width: 420px) {
            .topbar-note {
                max-width: 112px;
                text-align: right;
            }
            .field-grid {
                grid-template-columns: 1fr;
            }
            .field.full {
                grid-column: auto;
            }
            .choice-row {
                grid-template-columns: 1fr;
            }
            .submit-row {
                align-items: stretch;
                flex-direction: column;
            }
            .submit-row small {
                max-width: none;
            }
            button {
                width: 100%;
            }
        }
        .topbar {
            max-width: 760px;
            padding: 24px 20px;
        }
        .topbar-note,
        .story,
        .form-heading .eyebrow,
        .form-heading>p:last-child,
        .section-label,
        .field:has(#genre),
        section[aria-labelledby="handoff-title"],
        .checkline,
        .submit-row small {
            display: none;
        }
        main {
            display: block;
            max-width: 760px;
            min-height: 0;
            margin: 0 auto 40px;
            padding: 0 20px;
        }
        .form-panel {
            padding: 32px;
            border: 1px solid var(--line);
            border-radius: 5px;
        }
        .form-heading {
            margin-bottom: 22px;
        }
        .form-heading h2 {
            margin: 0;
            font-family: var(--sans);
            font-size: 28px;
            font-weight: 700;
        }
        form {
            gap: 16px;
        }
        .field-grid {
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .field.full {
            grid-column: auto;
        }
        .submit-row {
            justify-content: flex-start;
        }
        @media (max-width: 520px) {
            .form-panel {
                padding: 22px 18px;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">p</span> PASS IT ON</div>
    </header>
    <main>
        <section class="form-panel" aria-labelledby="form-title">
            <div class="form-heading">
                <h2 id="form-title">Donate your books</h2>
            </div>

            <form id="donation-form">
                <section aria-labelledby="about-you">
                    <h3 class="section-label" id="about-you"><span>1</span> Your details</h3>
                    <div class="field-grid">
                        <div class="field">
                            <label for="name">Your name</label>
                            <input id="name" name="name" autocomplete="name" placeholder="Alex Morgan" required>
                        </div>
                        <div class="field">
                            <label for="email">Email address</label>
                            <input id="email" name="email" type="email" autocomplete="email"
                                placeholder="alex@example.com" required>
                        </div>
                    </div>
                </section>

                <section aria-labelledby="about-books">
                    <h3 class="section-label" id="about-books"><span>2</span> The books</h3>
                    <div class="field-grid">
                        <div class="field">
                            <label for="quantity">How many books?</label>
                            <select id="quantity" name="quantity" required>
                                <option value="" selected disabled>Select a quantity</option>
                                <option>1–5 books</option>
                                <option>6–15 books</option>
                                <option>16–30 books</option>
                                <option>More than 30</option>
                            </select>
                        </div>
                        <div class="field full">
                            <label for="notes">Anything else we should know? <span
                                    style="font-weight:400;color:#7b867f">(optional)</span></label>
                            <textarea id="notes" name="notes"
                                placeholder="Condition, special collections, or a favorite title…"></textarea>
                        </div>
                    </div>
                </section>
                <div class="submit-row">
                    <button type="submit">Send my donation <span aria-hidden="true">→</span></button>
                </div>
            </form>
            <div class="success" id="success-message" role="status" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
