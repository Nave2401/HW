<!DOCTYPE html>
<html>
<head>
  <title>My Anime Character Cards</title>
  <style>
    body {
     background:linear-gradient(to bottom, rgb(255, 166, 0) , rgb(255, 234, 46));
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: #e5ff00;
    }
    p {
      color: #444444;
    }
    button {
      background-color: #e5ff00;
      color: #222222;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .card-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }
    .hero-card {
      background-color: white;
      border: 3px solid #e5ff00;
      border-radius: 12px;
      width: 220px;
      padding: 18px;
    }
    .hero-name {
      font-size: 22px;
      font-weight: bold;
      color: #222222;
    }
    .hero-power {
      color: #0057b8;
      font-weight: bold;
    }
    .hero-mission {
      color: #666666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>My Anime Character Cards</h1>
  <p>
    Click the button to create anime character objects using JavaScript classes.
  </p>
  <button onclick="showAnimeCharacters()">Show Anime Characters</button>
  <div class="card-container" id="heroCards"></div>
  <script>
    // What is a Class?
    // A class is a blueprint used to create objects.
    class AnimeCharacter {

      // Constructor
      constructor(name, power, mission) {

        // The this keyword stores values inside the object
        this.name = name;
        this.power = power;
        this.mission = mission;
      }

      // Class Method
      describeCharacter() {
        return "<div class='hero-card'>" +
               "<p class='hero-name'>" + this.name + "</p>" +
               "<p class='hero-power'>Power: " + this.power + "</p>" +
               "<p class='hero-mission'>Mission: " + this.mission + "</p>" +
               "</div>";
      }
    }

    function showAnimeCharacters() {

      // Creating Objects
      let character1 = new AnimeCharacter(
        "Naruto Uzumaki",
        "Shadow Clone Jutsu",
        "Protect the Hidden Leaf Village and become Hokage."
      );

      let character2 = new AnimeCharacter(
        "Monkey D. Luffy",
        "Rubber powers",
        "Become the Pirate King and find the One Piece."
      );

      let character3 = new AnimeCharacter(
        "Sailor Moon",
        "Moon Prism Power",
        "Fight for love and justice with the Sailor Guardians."
      );

      let character4 = new AnimeCharacter(
        "Saitama",
        "One Punch",
        "Defeat powerful monsters with one punch."
      );

      document.getElementById("heroCards").innerHTML =
        character1.describeCharacter() +
        character2.describeCharacter() +
        character3.describeCharacter() +
        character4.describeCharacter();
    }
  </script>
</body>
</html>
