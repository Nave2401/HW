<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Stack</title>
</head>
<body>
    <h2>JS Functions</h2>
    <p>Do a calculation and then display the result.</p>
    <p id="demo"></p>

    <script>
       function average(a, b) {
           return (a + b) / 2;
       }

       const result = average(10, 20);
       document.getElementById("demo").textContent = "Average: " + result;
    </script>
</body>
</html>
