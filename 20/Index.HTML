<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Study Progress Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f7ff;
            font-family: Arial, sans-serif;
        }
        .jumbotron {
            background-color: #e8edff;
            border-left: 6px solid #FF5A43;
            animation: fade-in 600ms ease-out both;
        }
        .jumbotron h1 {
            color: #FF5A43;
        }
        .jumbotron .btn {
            transition: transform 180ms ease, box-shadow 180ms ease;
        }
        .jumbotron .btn:hover,
        .jumbotron .btn:focus {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.16);
        }
        .container > .section-title,
        .container > p,
        .container > .progress {
            animation: fade-in-up 500ms ease-out both;
        }
        .container > .section-title:nth-of-type(1) { animation-delay: 100ms; }
        .container > p:nth-of-type(1) { animation-delay: 150ms; }
        .container > p:nth-of-type(2) { animation-delay: 200ms; }
        .container > p:nth-of-type(3) { animation-delay: 250ms; }
        .container > p:nth-of-type(4) { animation-delay: 300ms; }
        .section-title {
            color: #FF5A43;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .diamond-badge {
            display: inline-flex;
            width: 2rem;
            height: 2rem;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            transform: rotate(45deg);
            border-radius: 3px;
        }
        .diamond-badge span {
            transform: rotate(-45deg);
        }
        .progress-bar.animated {
            transform: scaleX(0);
            transform-origin: left;
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.25) 0,
                rgba(255, 255, 255, 0.25) 25%,
                transparent 25%,
                transparent 50%
            );
            background-size: 1rem 1rem;
            animation: progress-fill 1s ease-out forwards, progress-stripes 1s linear infinite;
        }
        .progress:nth-of-type(1) .progress-bar { animation-delay: 150ms; }
        .progress:nth-of-type(2) .progress-bar { animation-delay: 300ms; }
        .progress:nth-of-type(3) .progress-bar { animation-delay: 450ms; }
        .progress:nth-of-type(4) .progress-bar { animation-delay: 600ms; }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes progress-fill {
            to { transform: scaleX(1); }
        }
        @keyframes progress-stripes {
            to { background-position: 1rem 0; }
        }
        p {
            font-weight: bold;
            margin-bottom: 5px;
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My Study Progress Dashboard</h1>
            <p class="lead">Track your subjects, completed lessons, and learning progress in one place.</p>
            <button class="btn btn-primary">Math</button>
            <button class="btn btn-success">Science</button>
            <button class="btn btn-warning">English</button>
            <button class="btn btn-danger">Coding</button>
        </div>
    </div>
    <div class="container">
        <h2 class="section-title">Lessons Completed <span class="badge badge-danger diamond-badge"><span>24</span></span></h2>
        <p>Math <span class="badge badge-primary">8 lessons</span></p>
        <p>Science <span class="badge badge-success">6 lessons</span></p>
        <p>English <span class="badge badge-warning">5 lessons</span></p>
        <p>Coding <span class="badge badge-info">5 lessons</span></p>
        <h2 class="section-title">Subject Progress</h2>
        <p>Math</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary animated" style="width: 80%">80%</div>
        </div>
        <p>Science</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success animated" style="width: 65%">65%</div>
        </div>
        <p>English</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning animated" style="width: 55%">55%</div>
        </div>
        <p>Coding</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger animated" style="width: 70%">70%</div>
        </div>
    </div>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
