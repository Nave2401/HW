<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods in Loops</title>
</head>
<body>
    <h2>Methods and Loops</h2>
<p>Numbers from 1 to 10</p>
<p id="numbers"></p>
<p id="random"></p>
<p id="day"></p>
<script>
  let text = "";
  for (let i = 1; i <= 10; i++) {
    text += i + "<br>";
  }
  document.getElementById("numbers").innerHTML = text;
  const randomNumber = Math.floor(Math.random() * 10);
  document.getElementById("random").textContent = "The random number is " + randomNumber;
  const dayNumber = new Date().getDay();
  document.getElementById("day").textContent = "Today's day number is " + dayNumber;
</script>
</body>
</html>
