<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS String</title>
</head>
<body>
    <h2>JavaScript Strings Methods</h2>
    <p>Basic Methods</p>


    <script>
      str = "AmAzInG";

        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith("i"));
        document.write("<br>");


        str1 = "I am learning JavaScript";
        pattern = new RegExp("JavaScript");
        document.write(pattern.test(str1));
    </script>        
</body>
</html>
