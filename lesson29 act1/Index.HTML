<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Delivery Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #25243a;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(100%, 560px);
            margin: 0 auto;
        }

        .card {
            margin-top: 20px;
            padding: 24px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 30px rgba(28, 20, 66, 0.2);
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #fff;
            text-align: center;
        }

        h2 {
            margin-top: 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        button {
            padding: 11px 18px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            filter: brightness(1.08);
        }

        .info {
            margin: 12px 0 0;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>My Delivery Tracker</h1>
        <section class="card" aria-labelledby="order-heading">
            <h2 id="order-heading">Your order</h2>
            <div class="actions">
                <button onclick="saveOrder()">Save Order</button>
                <button onclick="startOrder()">Start Order</button>
            </div>
            <p class="info">JSON text: <span id="jsonText"></span></p>
        </section>
        <section class="card" aria-labelledby="status-heading">
            <h2 id="status-heading">Delivery status</h2>
            <p class="info">Order Status: <span id="orderStatus"></span></p>
        </section>
    </main>
    <script>
        var order = {
            name: "Pizza",
            price: "$5",
            shop: "Pizza Hut"
        };

        function saveOrder() {
            document.getElementById("jsonText").textContent = JSON.stringify(order);
        }

        function startOrder() {
            var orderStatus = document.getElementById("orderStatus");
            orderStatus.textContent = "Kitchen is preparing your order";

            setTimeout(function() {
                orderStatus.textContent = "Your order is ready for pickup";
                setTimeout(function() {
                    orderStatus.textContent = "Your order is out for delivery";
                }, 2000);
            }, 3000);
        }

        document.getElementById("orderStatus").onclick = function() {
            document.getElementById("orderStatus").textContent = "Your order has been delivered";
        };
    </script>
</body>
</html>
