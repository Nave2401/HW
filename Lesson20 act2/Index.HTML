<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope of Variables Function</title>
</head>
<body>
    <p>A function is a block of code that performs a specific task.</p>
    <button onclick="myFunction(5, 10)">Click me</button>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
   <script>
    function myFunction(x, y)
    {
        document.getElementById("demo").innerHTML = x;
        document.getElementById("demo1").innerHTML = y;
        document.getElementById("demo2").innerHTML = x + y;
   }
   </script>
</body>
</html>
