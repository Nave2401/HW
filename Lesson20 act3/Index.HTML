<!DOCTYPE html>
<html>
  <head>
    <title>Multiply Function</title>
    </head>
    <script>
        function multiply(a,b) {
            if (b === undefined) {
                alert("The value of b is undefined. Setting b to 5.");
                b = 5;
            }
            var result = a * b;
            document.getElementById("result").innerHTML = result;
        }
    </script>
  <body>
    <button onclick="multiply(4)">Click Me!</button>
    <p id="result"></p>
  </body>
</html>
