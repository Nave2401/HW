<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Functions in JS</title>
</head>
<body>
    <button onclick="myFunction(5, 3)">Execute JS Function</button>
    <script>
        function myFunction(x, y) {
            if (y === undefined) {
                y = 10; // Default value for y if not provided
            }
            document.write(x * y)
        }
    </script>
</body>
</html>
